<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Ultimate Pokedex</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="main-content grid-container">
  <div class="pokedex">

    <h1>Pokedex</h1>

    <input type="text" id="pokemonName" placeholder="Enter Pokemon">
    <button onclick="getPokemon()">Search</button>

    <h2 id="name"></h2>
    <img id="image">

    <div id="info" class="hidden">
      <p id="id"></p>
      <p id="type"></p>
      <p id="height"></p>
      <p id="weight"></p>
      <p id="ability"></p>
    </div>

    <div id="stats" class="hidden">
      <h3>Stats</h3>
      <p id="hp"></p>
      <p id="attack"></p>
      <p id="defense"></p>
      <p id="speed"></p>
    </div>

    <div id="evolution" class="hidden">
      <h3>Evolution</h3>
    </div>
  </div>

  <script src="script.js"></script>

</body>
</html>
